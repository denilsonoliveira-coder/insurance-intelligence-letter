name: Insurance Intelligence Letter

on:
  schedule:
    # Segunda-feira às 08:00 no horário de Brasília.
    # O cron do GitHub Actions utiliza UTC.
    - cron: "0 11 * * 1"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: insurance-intelligence-letter
  cancel-in-progress: false

jobs:
  generate-and-send:
    name: Gerar e enviar newsletter
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      PYTHONUNBUFFERED: "1"
      TZ: America/Sao_Paulo
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      EMAIL_USER: ${{ secrets.EMAIL_USER }}
      EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
      EMAIL_TO: ${{ secrets.EMAIL_TO }}

    steps:
      - name: Obter código-fonte
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Coletar notícias
        run: python scripts/news_collector.py

      - name: Gerar newsletter com Gemini
        run: python scripts/generate_letter.py

      - name: Enviar newsletter por e-mail
        run: python scripts/send_email.py

      - name: Publicar arquivos para diagnóstico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: insurance-intelligence-letter-${{ github.run_number }}
          path: output/
          if-no-files-found: warn
          retention-days: 14
